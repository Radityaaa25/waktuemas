<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none" stroke="#1E2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Penonton 1 (Kiri - Membeku/Menutup Mulut) -->
  <g transform="translate(40, 20)">
    <circle cx="40" cy="40" r="18" fill="#FFE3D6" />
    <path d="M28 34 C32 24, 52 24, 56 34 Z" fill="#1E2A4A" />
    <circle cx="36" cy="40" r="2" fill="#1E2A4A" stroke="none" />
    <circle cx="46" cy="40" r="2" fill="#1E2A4A" stroke="none" />
    <!-- Tangan menutup mulut kaget -->
    <path d="M28 80 L36 54 C38 48, 48 48, 46 54 L44 80" fill="#3CCFA8" />
    <path d="M30 70 C30 65, 52 65, 52 70 L54 160 L26 160 Z" fill="#3CCFA8" />
    <path d="M32 160 L32 230 L48 230 L48 160" fill="#1E2A4A" />
  </g>

  <!-- Penonton 2 (Tengah - Menunjuk / Ragu) -->
  <g transform="translate(140, 0)">
    <circle cx="45" cy="42" r="19" fill="#FFE3D6" />
    <path d="M32 36 C36 24, 58 24, 62 36 Z" fill="#D9D2FF" />
    <circle cx="40" cy="42" r="2" fill="#1E2A4A" stroke="none" />
    <circle cx="50" cy="42" r="2" fill="#1E2A4A" stroke="none" />
    <path d="M30 72 C32 68, 60 68, 62 72 L64 165 L28 165 Z" fill="#FFC94D" />
    <!-- Lengan menunjuk ke arah korban -->
    <path d="M60 85 L95 110 L105 105" stroke-width="4" />
    <circle cx="108" cy="104" r="5" fill="#FFE3D6" />
    <path d="M34 165 L36 240 L58 240 L56 165" fill="#1E2A4A" />
  </g>

  <!-- Tanda tanya melayang ekspresif -->
  <g transform="translate(18, 10)">
    <path d="M12 18 C12 8, 24 8, 24 16 C24 22, 18 22, 18 28" stroke="#FF5A6E" stroke-width="4" />
    <circle cx="18" cy="36" r="2.5" fill="#FF5A6E" stroke="none" />
  </g>
  <g transform="translate(260, 30)">
    <path d="M10 14 C10 6, 20 6, 20 12 C20 18, 15 18, 15 22" stroke="#FFC94D" stroke-width="3.5" />
    <circle cx="15" cy="28" r="2" fill="#FFC94D" stroke="none" />
  </g>
</svg>
